<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: rgb(162, 234, 162);
            color: rgb(0, 0, 0);
            padding: 15px;
            border-bottom: 4px solid rgb(99, 221, 255);
        }

        nav {
            background-color: rgb(152, 95, 152);
            padding: 10px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            display: inline;
            color: white;
            margin: 20px;
            font-weight: bold;
        }

        main {
            padding: 20px;
        }

        section {
            background-color: rgb(222, 222, 90);
            border: 3px solid orange;
            padding: 20px;
        }

        h2 {
            color: rgb(159, 24, 24);
        }

        p {
            color: rgb(119, 119, 139);
        }

        footer {
            background-color: darkblue;
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <header>
        <h1>Student Dashboard</h1>
    </header>

    <nav aria-label="Dashboard Navigation">
        <ul>
            <li>Profile</li>
            <li>Events</li>
            <li>Settings</li>
        </ul>
    </nav>

    <main>

        <section>
            <h2>Overview</h2>
            <p>Dashboard content.</p>
        </section>

    </main>

    <footer>
        <p>StudentHub</p>
    </footer>

</body>

</html>
